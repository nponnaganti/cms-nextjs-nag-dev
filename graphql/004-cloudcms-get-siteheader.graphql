query cloudcmsGetSiteheader {
  siteheader {
    contentID
    properties {
      versionID
      referenceName
      modified
      state
      definitionName
      itemOrder
    }
    seo {
      metaDescription
      metaKeywords
      metaHTML
      menuVisible
      sitemapVisible
    }
    fields {
      logo {
        label
        url
        fileSize
        height
        width
        pixelHeight
        pixelWidth
        target
      }
      siteName
    }
  }  
}