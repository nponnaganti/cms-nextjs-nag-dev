query cloudcmsGetSitemapNested {
  ag_sitemapnested {
    title
    name
    pageID
    menuText
    visible {
      menu
      sitemap
    }
    path
    redirecturl {
      url
      target
    }
    isFolder
    children(filter: "string") {
      title
      name
      pageID
      menuText
      visible {
        menu
        sitemap
      }
      path
      redirecturl {
        url
        target
      }
      isFolder
    }
  }    
}